# dbt connection profile for the SkyTrax rebuild.
# Secrets come from environment variables — never hardcode the password here.
# Point dbt at this directory with:  DBT_PROFILES_DIR=<repo>/profiles

skytrax_rebuild:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'SKYTRAX_TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'SKYTRAX_COMPUTE_XSMALL') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'SKYTRAX_REVIEWS_DB') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'DBT_DEV') }}"
      threads: 4
      client_session_keep_alive: false
