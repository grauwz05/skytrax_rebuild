# Minimal dbt project scaffold for the rebuild.
# Intentionally empty of model configuration — layer layout, materializations
# and schema routing are part of what the learner designs in LT-01..LT-05.

name: 'skytrax_rebuild'
version: '1.0.0'
profile: 'skytrax_rebuild'

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
